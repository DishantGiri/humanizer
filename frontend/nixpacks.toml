providers = ["node"]

[variables]
PORT = "3000"
HOSTNAME = "0.0.0.0"
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = [
  "pnpm run build",
  "cp -r public .next/standalone/public || true",
  "mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/static || true"
]

[start]
cmd = "node .next/standalone/server.js"